<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual iPod</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scene">
    <!-- iPod body -->
    <div class="ipod" id="ipod">

      <!-- Hold switch -->
      <div class="hold-area">
        <div class="hold-switch-wrap">
          <div class="hold-label">HOLD</div>
          <div class="hold-switch" id="holdSwitch" title="Hold switch">
            <div class="hold-knob"></div>
          </div>
        </div>
        <div class="headphone-jack"></div>
      </div>

      <!-- Screen bezel -->
      <div class="screen-bezel">
        <div class="screen" id="screen">
          <div class="screen-status" id="screenStatus">
            <span class="status-time" id="statusTime"></span>
            <span class="status-icons">
              <span class="battery-icon" id="batteryIcon">&#9646;&#9646;&#9646;</span>
            </span>
          </div>
          <div class="screen-body" id="screenBody">
            <!-- Rendered by JS -->
          </div>
        </div>
      </div>

      <!-- Divider line -->
      <div class="divider"></div>

      <!-- Click wheel -->
      <div class="wheel-area">
        <div class="click-wheel" id="clickWheel">
          <!-- Outer ring touch area -->
          <div class="wheel-ring" id="wheelRing">
            <!-- Button labels -->
            <div class="wheel-label top" id="btnMenu">MENU</div>
            <div class="wheel-label right" id="btnNext">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M6 18l8-6-8-6v12zm8-12v12h2V6h-2z"/>
              </svg>
            </div>
            <div class="wheel-label bottom" id="btnPlay">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" id="playBtnIcon">
                <path d="M8 5v14l11-7z"/>
              </svg>
            </div>
            <div class="wheel-label left" id="btnPrev">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>
              </svg>
            </div>
          </div>
          <!-- Center button -->
          <div class="center-button" id="btnSelect"></div>
        </div>
      </div>

      <!-- Dock connector -->
      <div class="dock-area">
        <div class="dock-connector"></div>
      </div>

    </div><!-- end .ipod -->

    <!-- Instructions overlay -->
    <div class="instructions">
      <h3>Virtual iPod</h3>
      <ul>
        <li>🖱 <strong>Drag</strong> the wheel ring to scroll</li>
        <li>⬆ <strong>MENU</strong> — go back</li>
        <li>⏮ <strong>Left</strong> — previous track</li>
        <li>⏭ <strong>Right</strong> — next track</li>
        <li>▶ <strong>Bottom</strong> — play / pause</li>
        <li>⬤ <strong>Center</strong> — select</li>
      </ul>
      <p class="upload-hint">You can also <label for="fileInput" class="upload-link">upload your own music</label></p>
    </div>

  </div><!-- end .scene -->

  <!-- Hidden file input -->
  <input type="file" id="fileInput" accept="audio/*" multiple style="display:none">

  <script src="script.js"></script>
</body>
</html>
